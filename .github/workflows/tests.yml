name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

      - name: Run v2 evaluation suite (forced mock mode, no API key needed)
        run: python evals/run_v2_evals.py

      - name: Run v3 security evaluation suite (deterministic, no API key needed)
        run: python evals/run_v3_evals.py
